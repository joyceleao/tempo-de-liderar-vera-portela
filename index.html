<style>
  :root{ --petroleo:#183A4A; --vinho:#5B1E21; --bege:#E8E2D8; --grafite:#2E2E2E; --suave:#F8F7F4; --linha:#d9d3c8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{ background:var(--suave); color:var(--grafite); font-family:'Inter',system-ui,-apple-system,Arial,sans-serif; font-size:17px; line-height:1.5; min-height:100vh; min-height:100dvh; }
  .app{ max-width:560px; margin:0 auto; padding:20px 20px calc(28px + env(safe-area-inset-bottom)); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  header{ display:flex; justify-content:space-between; align-items:center; padding-bottom:16px; border-bottom:1px solid var(--linha); }
  header svg{ height:15px; width:auto; display:block; }
  header span{ font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--petroleo); }
  main{ flex:1; display:flex; flex-direction:column; padding-top:28px; }
  .fio{ width:44px; height:3px; background:var(--vinho); margin-bottom:20px; }
  .rotulo{ font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--vinho); margin-bottom:10px; }
  h1{ font-family:'Abhaya Libre',Georgia,serif; font-weight:800; color:var(--petroleo); font-size:44px; line-height:1.02; letter-spacing:-.01em; }
  h1 em{ font-style:normal; color:var(--vinho); }
  h2{ font-family:'Abhaya Libre',Georgia,serif; font-weight:700; color:var(--petroleo); font-size:27px; line-height:1.15; }
  h3{ font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--vinho); margin:18px 0 4px; }
  p + p{ margin-top:12px; }
  .lead{ margin-top:18px; }
  .pontos{ list-style:none; margin-top:20px; border-top:1px solid var(--linha); }
  .pontos li{ padding:12px 0; border-bottom:1px solid var(--linha); font-size:16px; }
  .pontos b{ color:var(--petroleo); font-weight:600; }
  .pequeno{ font-size:14px; color:#5c6b72; }
  .empurra{ flex:1; min-height:24px; }

  button{ font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .btn{ display:block; width:100%; background:var(--petroleo); color:var(--suave); border:0; border-radius:10px; padding:17px 20px; font-size:17px; font-weight:600; text-align:center; }
  .btn:active{ background:#0f2a37; }
  .btn[disabled]{ opacity:.45; }
  .btn-vinho{ background:var(--vinho); }
  .btn-vinho:active{ background:#431417; }
  .link{ background:none; border:0; color:var(--petroleo); font-size:15px; font-weight:500; text-decoration:underline; text-underline-offset:3px; padding:12px 4px; }

  /* perguntas */
  .barra{ height:4px; background:var(--bege); border-radius:2px; overflow:hidden; margin-bottom:18px; }
  .barra i{ display:block; height:100%; background:var(--vinho); transition:width .25s; }
  .passo{ font-size:12px; font-weight:600; letter-spacing:.16em; color:var(--vinho); margin-bottom:10px; }
  .opcoes{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .op{ display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left; background:#fff; border:1.5px solid var(--linha); border-radius:10px; padding:14px 14px; color:var(--grafite); font-size:16px; line-height:1.4; }
  .op b{ flex:0 0 30px; height:30px; border-radius:50%; background:var(--bege); color:var(--petroleo); font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .op.sel{ border-color:var(--petroleo); background:#eef2f3; }
  .op.sel b{ background:var(--petroleo); color:var(--suave); }
  .nav{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; }

  /* contagem */
  .contas{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:22px; }
  .conta{ background:#fff; border:1px solid var(--linha); border-radius:10px; padding:14px 6px; text-align:center; }
  .conta b{ display:block; font-family:'Abhaya Libre',Georgia,serif; font-weight:800; font-size:34px; line-height:1; color:var(--petroleo); }
  .conta span{ display:block; font-size:13px; color:#5c6b72; margin-top:6px; }
  .aviso{ margin-top:22px; background:var(--bege); border-left:3px solid var(--vinho); padding:14px 16px; font-size:16px; border-radius:0 8px 8px 0; }

  /* leitura */
  .estilo{ background:#fff; border:1px solid var(--linha); border-radius:12px; padding:20px 18px 22px; margin-top:18px; }
  .estilo-topo{ display:flex; align-items:center; gap:16px; padding-bottom:14px; border-bottom:1px solid var(--linha); }
  .estilo-letra{ font-family:'Abhaya Libre',Georgia,serif; font-weight:800; font-size:76px; line-height:.8; color:var(--vinho); }
  .estilo-nome{ font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#5c6b72; }
  .estilo-verbo{ font-family:'Abhaya Libre',Georgia,serif; font-weight:800; font-size:32px; line-height:1; color:var(--petroleo); margin-top:4px; }
  .estilo-pergunta{ font-family:'Abhaya Libre',Georgia,serif; font-weight:700; font-size:23px; line-height:1.2; color:var(--vinho); margin-top:18px; }
  .devolucao{ margin-top:22px; font-size:16px; }

  /* contacto */
  .contacto{ margin-top:30px; padding-top:26px; border-top:1px solid var(--linha); }
  label{ display:block; font-size:14px; font-weight:600; color:var(--petroleo); margin:16px 0 6px; }
  input[type=text],input[type=email],input[type=tel]{ width:100%; font:inherit; font-size:17px; padding:14px; border:1.5px solid var(--linha); border-radius:10px; background:#fff; color:var(--grafite); }
  input:focus{ outline:2px solid var(--petroleo); outline-offset:1px; }
  .escolhas{ display:flex; flex-direction:column; gap:8px; }
  .escolha{ display:flex; gap:12px; align-items:flex-start; background:#fff; border:1.5px solid var(--linha); border-radius:10px; padding:13px 14px; font-size:16px; font-weight:400; color:var(--grafite); margin:0; }
  .escolha input{ margin-top:4px; accent-color:var(--petroleo); width:18px; height:18px; flex:0 0 18px; }
  .consente{ display:flex; gap:12px; align-items:flex-start; font-size:14px; font-weight:400; color:var(--grafite); margin:20px 0 18px; }
  .consente input{ margin-top:2px; accent-color:var(--petroleo); width:20px; height:20px; flex:0 0 20px; }
  .erro{ color:var(--vinho); font-size:14px; font-weight:500; margin-bottom:12px; }
  .final{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px 0 48px; }
  .final-letra{ font-family:'Abhaya Libre',Georgia,serif; font-weight:800; font-size:150px; line-height:.85; color:var(--vinho); margin-top:18px; }
  .final-nome{ font-size:52px; margin-top:6px; }
  footer{ margin-top:30px; font-size:12px; color:#5c6b72; text-align:center; }
</style>

var $ = document.getElementById("ecra");
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function ir(ecra){ estado.ecra = ecra; guardar(); desenhar(); window.scrollTo(0,0); }

function contar(){
  var c = {A:0,B:0,C:0,D:0};
  estado.r.forEach(function(x){ if (c[x] !== undefined) c[x]++; });
  return c;
}
// estilo(s) com mais respostas; só há mais de um em caso de empate exato
function resultado(){
  var c = contar(), max = Math.max(c.A, c.B, c.C, c.D);
  return { c:c, estilos: LETRAS.filter(function(l){ return c[l] === max; }).map(function(l){ return CHAVE[l]; }) };
}

function enviar(extra){
  if (!CONFIG.ENDPOINT || !estado.lead) return Promise.resolve();
  var d = { id:estado.id, evento:CONFIG.EVENTO, consentimento:"sim" }, k;
  for (k in estado.lead) d[k] = estado.lead[k];
  for (k in (extra||{})) d[k] = extra[k];
  return fetch(CONFIG.ENDPOINT, { method:"POST", mode:"no-cors", keepalive:true,
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(d) });
}

/* ============================================================
   ECRÃS: início > contacto > 12 perguntas > resultado
   ============================================================ */
function desenhar(){
  if (!estado.lead && estado.ecra !== "inicio") estado.ecra = "contacto";
  if (estado.ecra === "pergunta" && estado.n >= PERGUNTAS.length) estado.ecra = "resultado";
  ({inicio:eInicio, contacto:eContacto, pergunta:ePergunta, resultado:eResultado})[estado.ecra]();
}

function eInicio(){
  $.innerHTML =
   '<div class="fio"></div>'+
   '<h1>Como reages?<br><em>Não como gostarias.</em></h1>'+
   '<p class="lead">Em cada situação, escolhe a resposta que mais se aproxima da tua <b>primeira reação espontânea</b>. Não a resposta ideal, nem a que achas que o grupo espera.</p>'+
   '<ul class="pontos">'+
   '<li><b>12 situações</b> de liderança escutista</li>'+
   '<li><b>Sem respostas certas</b>: uma opção por situação</li>'+
   '<li><b>No fim</b>, vês logo o teu resultado</li>'+
   '</ul>'+
   '<div class="empurra"></div>'+
   '<button class="btn" id="b">'+(estado.lead ? "Continuar" : "Começar")+'</button>';
  document.getElementById("b").onclick = function(){ ir(estado.lead ? "pergunta" : "contacto"); };
}

function eContacto(){
  var q = CONFIG.QUALIFICADORA, h = '<form id="f" novalidate>';
  h += '<div class="fio"></div><p class="rotulo">Antes de começar</p><h2>Os teus dados</h2>';
  h += '<label for="nome">Nome</label><input type="text" id="nome" autocomplete="name" required>';
  h += '<label for="email">E-mail</label><input type="email" id="email" autocomplete="email" inputmode="email" required>';
  h += '<label for="tel">WhatsApp</label><input type="tel" id="tel" autocomplete="tel" inputmode="tel" placeholder="+351" required>';
  if (q){
    h += '<label>'+esc(q.pergunta)+'</label><div class="escolhas">';
    q.opcoes.forEach(function(o){ h += '<label class="escolha"><input type="radio" name="q" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>'; });
    h += '</div>';
  }
  h += '<label class="consente"><input type="checkbox" id="ok"><span>Autorizo a Vera Portela a guardar o meu nome, contactos e o resultado deste exercício, e a contactar-me por e-mail ou WhatsApp sobre o seu trabalho. Posso pedir a remoção dos meus dados a qualquer momento.</span></label>';
  h += '<p class="erro" id="erro" hidden></p><button class="btn" id="env" type="submit">Começar o teste</button></form>';
  $.innerHTML = h;
  var f = document.getElementById("f"), erro = document.getElementById("erro");
  f.onsubmit = function(ev){
    ev.preventDefault();
    var nome = f.nome.value.trim(), email = f.email.value.trim(), tel = f.tel.value.trim();
    var sel = f.querySelector('input[name=q]:checked');
    var falta = !nome ? "Escreve o teu nome." :
                !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "Confirma o e-mail." :
                tel.replace(/\D/g,"").length < 9 ? "Confirma o número de WhatsApp." :
                (q && !sel) ? "Escolhe uma opção na pergunta." :
                !f.ok.checked ? "Para começar, é preciso assinalar a autorização." : "";
    if (falta){ erro.textContent = falta; erro.hidden = false; return; }
    estado.id = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    estado.lead = { nome:nome, email:email, whatsapp:tel, qualificadora: sel ? sel.value : "" };
    estado.n = 0; estado.r = [];
    enviar({ fase:"inicio" }).catch(function(){});   // o contacto fica registado já aqui
    ir("pergunta");
  };
}

function ePergunta(){
  var n = estado.n, p = PERGUNTAS[n], h = "";
  h += '<div class="barra"><i style="width:'+Math.round(n/PERGUNTAS.length*100)+'%"></i></div>';
  h += '<p class="passo">'+(n+1)+' / '+PERGUNTAS.length+'</p>';
  h += '<h2>'+esc(p[0])+'</h2><div class="opcoes">';
  for (var i=0;i<4;i++){
    h += '<button class="op'+(estado.r[n]===LETRAS[i]?" sel":"")+'" data-l="'+LETRAS[i]+'"><b>'+LETRAS[i]+'</b><span>'+esc(p[i+1])+'</span></button>';
  }
  h += '</div><div class="nav">'+(n>0?'<button class="link" id="v">Voltar</button>':'<span></span>')+
       (estado.r[n]?'<button class="link" id="s">Seguinte</button>':'<span></span>')+'</div>';
  $.innerHTML = h;
  function avancar(){ estado.n = n+1; if (estado.n >= PERGUNTAS.length) fim(); else ir("pergunta"); }
  Array.prototype.forEach.call($.querySelectorAll(".op"), function(b){
    b.onclick = function(){
      estado.r[n] = b.getAttribute("data-l");
      Array.prototype.forEach.call($.querySelectorAll(".op"), function(x){ x.classList.toggle("sel", x===b); });
      guardar();
      setTimeout(avancar, 220);
    };
  });
  var v = document.getElementById("v"); if (v) v.onclick = function(){ estado.n = n-1; ir("pergunta"); };
  var s = document.getElementById("s"); if (s) s.onclick = avancar;
}

function fim(){
  var R = resultado();
  enviar({ fase:"fim", resultado:R.estilos.join("+"), A:R.c.A, B:R.c.B, C:R.c.C, D:R.c.D }).catch(function(){});
  ir("resultado");
}

function eResultado(){
  var R = resultado(), h = '<div class="final"><p class="rotulo">O teu resultado</p>';
  R.estilos.forEach(function(l){
    h += '<div class="final-letra">'+l+'</div><h1 class="final-nome">'+esc(ESTILOS[l].nome)+'</h1>';
  });
  h += '</div>';
  $.innerHTML = h;
}

desenhar();
</script>
</body>
</html>
